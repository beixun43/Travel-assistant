/* ================= 工具 ================= */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toList = v => Array.isArray(v) ? v : (v ? [v] : []);
const TIER = {"低":0,"中低":1,"中":2,"中高":3,"高":4};

function daysRange(s){
  s = String(s || "").trim();
  if(!s) return [0,99];
  if(s.includes("+") || s.includes("以上")){ const n = s.match(/\d+/); return [n ? +n[0] : 10, 99]; }
  const nums = s.match(/\d+/g);
  if(nums && nums.length >= 2) return [+nums[0], +nums[1]];
  if(nums) return [+nums[0], +nums[0]];
  return [0,99];
}

/* ================= 打分引擎 ================= */
function scoreDestination(d, p){
  let s = 0;
  const pref = new Set(toList(p.preference));
  if(pref.size) s += d.types.filter(t => pref.has(t)).length * 3;
  const season = p.season;
  if(!season || season === "灵活" || season === "无所谓") s += 1.2;
  else if(d.season.includes(season)) s += 4;
  const bt = TIER[d.budget] ?? 2, ut = TIER[p.budget_tier || "中"] ?? 2;
  if(bt <= ut) s += 3; else if(bt - ut === 1) s += 1;
  const tr = p.transport;
  if(!tr || tr === "无所谓") s += 1.2; else if(d.transport.includes(tr)) s += 3;
  if(p.style && d.style.includes(p.style)) s += 4;
  if(p.companion && d.companion.includes(p.companion)) s += 3;
  if(p.days){
    const u = daysRange(p.days), dd = daysRange(d.days);
    if(dd[0] <= u[1] && dd[1] >= u[0]) s += 2;
    else { const gap = Math.min(Math.abs(u[1]-dd[0]), Math.abs(u[0]-dd[1])); if(gap <= 2) s += 1; }
  }
  const acts = new Set(toList(p.activities));
  if(acts.size) s += d.activities.filter(a => acts.has(a)).length * 2;
  if(p.climate && p.climate !== "无所谓" && d.climate.includes(p.climate)) s += 2;
  if(p.fitness && p.fitness.includes("行动不便") && d.activities.includes("徒步登山")) s -= 3;
  if(p.fitness && p.fitness.includes("高强度") && d.activities.includes("徒步登山")) s += 2;
  if(p.extra && /免签|落地签|签证/.test(p.extra)){
    const vn = d.visa_note || "";
    if(vn.includes("免签") || vn.includes("落地签")) s += 2;
  }
  return s;
}

function recommend(p, topN, exclude, weekend, province){
  topN = topN || 6; exclude = exclude || new Set();
  const scope = p.scope || "国内";
  const scored = [];
  for(const d of DESTINATIONS){
    if(exclude.has(d.name)) continue;
    if(scope === "国内" || scope === "国外"){ if(d.country !== scope) continue; }
    if(weekend){
      const dd = daysRange(d.days);
      if(dd[0] > 2) continue;
      if(province){
        const allowed = weekendRegions(province);
        const city = (p.city || "").trim();
        if(city) allowed.add(city);
        if(!allowed.has(d.region)) continue;
      }
    }
    let s = scoreDestination(d, p);
    if(weekend && province && d.region === province) s += 5;
    if(s > 0) scored.push([s, d]);
  }
  scored.sort((a,b) => b[0] - a[0]);
  const out = [], rc = {};
  for(const [s, d] of scored){
    if((rc[d.region] || 0) >= 2) continue;
    rc[d.region] = (rc[d.region] || 0) + 1;
    out.push({score: Math.round(s*10)/10, dest: d});
    if(out.length >= topN) break;
  }
  return out;
}

function buildProfile(answers){
  const p = {};
  p.scene = answers.scene || "";
  p.city = (answers.city || "").trim();
  p.district = (answers.district || "").trim();
  p.preference = answers.preference || [];
  const rawB = String(answers.budget || "").replace(/[,，]/g, "").trim();
  let btier = "中", blabel = "不限";
  const bn = rawB.match(/\d+(?:\.\d+)?/);
  if(bn){
    const n = parseFloat(bn[0]);
    btier = n <= 3000 ? "低" : n <= 6000 ? "中低" : n <= 10000 ? "中" : n <= 20000 ? "中高" : "高";
    blabel = n + "元/人";
  }
  p.budget_tier = btier; p.budget_label = blabel;
  p.companion = COMPANION_MAP[answers.companion] || answers.companion || "不限";
  p.season = SEASON_MAP[answers.season] || answers.season || "灵活";
  p.months = (answers.months || "").trim();

  p.scope = answers.scope || "国内";

  p.days = DAYS_MAP[answers.days] || "";
  p.diet = answers.diet || "";
  p.fitness = answers.fitness || "";

/* ================= 搜索（代理链 + 优雅降级） ================= */
async function fetchWithTimeout(url, ms, opts){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  try{
    const r = await fetch(url, Object.assign({}, opts, {signal: ctl.signal}));
    return r.ok ? r : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

/* 读取文本时把整个请求+读正文都包在超时里，避免代理返回响应头后卡住正文导致永久挂起 */
async function fetchTextWithTimeout(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 7000);
  try{
    const r = await fetch(url, {signal: ctl.signal});
    if(!r.ok) return null;
    return await r.text();
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}

/* 给任意 Promise 加总时限，超时返回兜底值，保证流程永远能往下走 */
function withTimeout(promise, ms, fallback){
  let done = false;
  return Promise.race([
    Promise.resolve(promise).catch(() => fallback),
    new Promise(res => setTimeout(() => { if(!done) res(fallback); }, ms)),
  ]).finally(() => { done = true; });
}

const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];

async function fetchViaProxies(url, ms){
  // 多个代理同时竞速，取最先成功的那个（而不是一个一个等超时）
  ms = ms || 6000;
  const attempts = PROXIES.map(async make => {
    const txt = await fetchTextWithTimeout(make(url), ms);
    if(!txt || txt.length < 200) throw new Error("empty");
    return txt;
  });
  try{
    return await Promise.any(attempts);
  }catch(e){
    return null;
  }
}

function parseBingHtml(html, max){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = [];
  for(const li of doc.querySelectorAll("li.b_algo")){
    const a = li.querySelector("h2 a");
    if(!a) continue;
    const p = li.querySelector(".b_caption p, p");
    out.push({title: (a.textContent||"").trim(), href: a.href||"", body: (p ? p.textContent : "").trim()});
    if(out.length >= max) break;
  }
  return out;
}

function parseJinaMarkdown(md, max){
  const out = [], lines = md.split(/\r?\n/);
  for(let i = 0; i < lines.length && out.length < max; i++){
    const m = lines[i].match(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/);
    if(!m) continue;
    let body = "";
    for(let j = i+1; j < Math.min(i+4, lines.length); j++){
      const t = lines[j].trim();
      if(t && !t.startsWith("[") && !t.startsWith("http")){ body = t; break; }
    }
    out.push({title: m[1], href: m[2], body});
  }
  return out;
}

async function webSearch(query, max){
  const url = "https://cn.bing.com/search?q=" + encodeURIComponent(query) + "&setlang=zh-hans";
  const txt = await fetchViaProxies(url, 5000);
  if(!txt) return [];
  const t = txt.trim();
  if(t.startsWith("<")){
    const r = parseBingHtml(txt, max);
    if(r.length) return r;
  }else{
    const r = parseJinaMarkdown(txt, max);
    if(r.length) return r;
  }
  return [];
}

function parse360(html, max){
  const out = [];
  const re = /<li[^>]*class="res-list[^"]*"[^>]*>([\s\S]*?)<\/li>/g;
  let m;
  while((m = re.exec(html)) && out.length < max){
    const raw = m[1];
    if(raw.includes("map.360.cn") || raw.includes("_loader")) continue;
    const b = raw.replace(/<style[\s\S]*?<\/style>/g, "").replace(/<script[\s\S]*?<\/script>/g, "");
    const am = b.match(/<a[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/);
    if(!am) continue;
    let href = am[1].replace(/&amp;/g, "&");
    const lm = href.match(/[?&]url=([^&]+)/);
    if(lm){ try{ href = decodeURIComponent(lm[1]); }catch(e){} }
    const doc = new DOMParser().parseFromString(b, "text/html");
    const text = (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    out.push({title: am[2].replace(/<[^>]+>/g, "").trim(), href, body: text});
  }
  return out;
}

async function webSearchMulti(query, max){
  // 360 与 必应 同时搜，谁先成功用谁
  const u360 = "https://www.so.com/s?q=" + encodeURIComponent(query);
  const uBing = "https://cn.bing.com/search?q=" + encodeURIComponent(query) + "&setlang=zh-hans";
  const [t360, tBing] = await Promise.all([
    fetchViaProxies(u360, 6000),
    fetchViaProxies(uBing, 6000),
  ]);
  if(t360){
    const r = parse360(t360, max);
    if(r.length) return r;
  }
  if(tBing){
    const t = tBing.trim();
    const r = t.startsWith("<") ? parseBingHtml(tBing, max) : parseJinaMarkdown(tBing, max);
    if(r.length) return r;
  }
  return [];
}

function extractNames(text){
  const toks = (text || "").split(/[、，,。；;·\s/|:：()（）《》<>\[\]！!？?_\-\u2014\u2013～~【】「」]+/);
  const names = [];
  for(let t of toks){
    t = t.trim();
    t = t.replace(/^(去|到|在|游|玩|逛|看|赏|泡|爬|登|飞|住)/, "");
    t = t.replace(/(推荐|攻略|旅游|景点|景区|公园|古镇|古城|一日游|两日游|周末|周边|出发|门票|开放|时间|地址|交通|自驾|高铁|小时|公里|分钟|多少|哪些|有什么|怎么|如何|值得|适合|最佳|必去|打卡|小众|热门|免费|好玩|美食|住宿|酒店|民宿|价格|人均|预算|行程|路线|大全|合集|名单|榜单|排名|国家|城市|地方|这些|那些|国内|国外|风景|风情|玩法|资讯|新闻|介绍|说明|指南|秘笈|手册|盘点|汇总)$/, "");
    if(t.length < 2 || t.length > 7) continue;
    if(!/^[\u4e00-\u9fa5·]+$/.test(t)) continue;
    if(STOP_WORDS.some(w => t.includes(w))) continue;
    if(t.includes("的")) continue;
    if(["小镇古街","山林","海边","风景","风光","市区","城区"].includes(t)) continue;
    if(t.includes("省") && !t.includes("·")) continue;
    let ok = true;
    for(const w of ["省辖","地级","辖","购物","市辖区","自治州","辖区"]){ if(t.includes(w)){ ok = false; break; } }
    if(!ok) continue;
    if(SUFFIXES.some(s => t.endsWith(s)) || t.includes("·")) names.push(t);
  }
  return names;
}

async function liveDiscover(p, excludeNames, maxN, weekend){
  const city = (p.city || "").trim(), district = (p.district || "").trim();
  const queries = [];
  if(weekend && city){
    queries.push(city + " 周边 周末 一日游 推荐", city + " 出发 2小时 短途 景点",
                  city + district + " 附近 景点 推荐", city + " 周边 小众 景点");
  }else{
    const prefWord = toList(p.preference).join("/").slice(0, 8);
    const season = p.season || "";
    if(p.scope === "国外"){
      const country = COUNTRY_WORDS.find(w => (p.extra || "").includes(w));
      if(country) queries.push(country + " 小众 旅游目的地 推荐");
      if(prefWord) queries.push("国外 小众 " + prefWord + " 目的地推荐");
      if(season) queries.push(season + "季 出境游 小众目的地推荐");
    }else{
      if(prefWord) queries.push("国内 小众 " + prefWord + " 目的地推荐");
      if(season) queries.push(season + "季 " + prefWord + " 小众目的地推荐");
    }
  }
  const excluded = new Set(excludeNames || []);
  if(city){ excluded.add(city); excluded.add(city + "市"); excluded.add(city + "市区"); }
  if(district) excluded.add(district);
  const cand = new Map(), hrefs = [];
  const queryResults = await Promise.all(
    queries.slice(0, 4).map(q => withTimeout(webSearchMulti(q, 5), 6000, []))
  );
  for(const rs of queryResults){
    for(const r of rs){
      if(r.href) hrefs.push(r.href);
      for(const n of extractNames((r.title || "") + " " + (r.body || ""))){
        if(excluded.has(n)) continue;
        if(city && n.startsWith(city) && n.length <= city.length + 4) continue;
        const c = cand.get(n);
        if(c) c[0] += 1; else cand.set(n, [1, r.href || "", r.body || ""]);
      }
    }
  }
  if(cand.size < 4){
    for(const u of hrefs.slice(0, 2)){
      let txt = null;
      try{
        const r = await fetchWithTimeout("https://r.jina.ai/" + u, 8000);
        if(r) txt = await r.text();
      }catch(e){}
      if(!txt || txt.length < 400) continue;
      for(const n of extractNames(txt.slice(0, 8000))){
        if(excluded.has(n)) continue;
        if(city && n.startsWith(city) && n.length <= city.length + 4) continue;
        const c = cand.get(n);
        if(c) c[0] += 2; else cand.set(n, [2, u, txt.slice(0, 300)]);
      }
    }
  }
  const ranked = [...cand.entries()].sort((a, b) => (b[1][0] - a[1][0]) || (b[0].length - a[0].length));
  const rel = ["旅游","景点","攻略","景区","游玩","公园","门票","打卡","风景","度假","古镇","古城","温泉","海滩","一日游"];
  const enriched = await Promise.all(
    ranked.slice(0, 10).map(async (item) => {
      const name = item[0], arr = item[1];
      const snips = await withTimeout(webSearchMulti(name + " 必去景点 攻略", 3), 6000, []);
      if(!snips.length) return null;
      const best = snips.find(s => rel.some(k => (s.body || "").includes(k)));
      if(!best) return null;
      return {name, href: best.href || arr[1], body: best.body || arr[2]};
    })
  );
  return enriched.filter(Boolean).slice(0, maxN);
}

function decodeBingUrl(u){
  u = (u||"").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">");
  for(const [a,b] of [["\\u002F","/"],["\\u002f","/"],["\\u0026","&"],["\\u0025","%"],["\\u003D","="],["\\u003d","="]]) u = u.split(a).join(b);
  return u;
}

async function imageSearch(query, max){
  max = max || 4;
  const qs = [query];
  if(EN_KEYWORDS[query]) qs.unshift(EN_KEYWORDS[query]);
  else if(query.includes("·")) qs.push(query.split("·")[1]);
  const urls = [], seen = new Set();
  for(const q of qs){
    try{
      const api = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="
                + encodeURIComponent(q) + "&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*";
      const r = await fetchWithTimeout(api, 5000);
      if(r){
        const j = await r.json();
        const pages = (j.query && j.query.pages) || {};
        for(const k in pages){
          const info = ((pages[k].imageinfo)||[{}])[0];
          const u = info.thumburl || info.url;
          if(u && !seen.has(u)){ seen.add(u); urls.push(u); }
        }
      }
    }catch(e){}
    if(urls.length >= max) break;
  }
  if(urls.length < max){
    const url = "https://cn.bing.com/images/search?q=" + encodeURIComponent(query) + "&form=HDRSC2";
    const txt = await fetchViaProxies(url, 5000);
    if(txt){
      const mm = txt.match(/murl&quot;:&quot;(.*?)&quot;/g) || [];
      for(let m of mm){
        m = decodeBingUrl(m.replace(/^murl&quot;:&quot;/, "").replace(/&quot;$/, ""));
        if(m.startsWith("http") && !seen.has(m)){ seen.add(m); urls.push(m); }
        if(urls.length >= max) break;
      }
    }
  }
  return urls.slice(0, max);
}

function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

function resizeImage(dataUrl, maxW, quality){
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxW||880) / img.naturalWidth);
      if(scale >= 1){ res(dataUrl); return; }
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * scale);
      cv.height = Math.round(img.naturalHeight * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      try{ res(cv.toDataURL("image/jpeg", quality || 0.8)); }catch(e){ res(dataUrl); }
    };
    img.onerror = () => res(null);
    img.src = dataUrl;
  });
}

async function imgToDataUrl(url){
  try{
    const r = await fetchWithTimeout(url, 10000);
    if(!r) return null;
    const blob = await r.blob();
    if(!blob || blob.size < 4000 || blob.size > 8*1024*1024) return null;
    const du = await blobToDataURL(blob);
    return await resizeImage(du, 880, 0.8);
  }catch(e){ return null; }
}

async function discoverySearch(p, maxKeep){
  maxKeep = maxKeep || 6;
  const season = p.season || "", pref = toList(p.preference), scope = p.scope || "", months = (p.months||"").trim();
  const candidates = [];
  if(season === "秋") candidates.push("秋游目的地推荐");
  if(months) candidates.push(months + "旅游推荐");
  if(pref[0]){
    candidates.push(pref[0] + "类目的地推荐");
    candidates.push("知乎 " + pref[0] + "旅游推荐");
  }
  if(season) candidates.push(season + "季旅游目的地推荐");
  if(scope === "国内" || scope === "国外") candidates.push(scope + "旅游目的地推荐");
  candidates.push("旅游目的地推荐");
  const good = ["旅游","攻略","推荐","目的地","景点","游玩","游记","打卡","景区","旅行","度假","路线"];
  const out = [], seen = new Set();
  const qs = candidates.slice(0,3);
  for(let i = 0; i < qs.length; i++){
    if(out.length >= maxKeep) break;
    setStatus(`正在全网搜索热门推荐线索 (${i+1}/${qs.length})…`);
    for(const r of await webSearchMulti(qs[i], 5)){
      const text = (r.title||"") + (r.body||"");
      if(!good.some(k => text.includes(k))) continue;
      if(seen.has(text) || !r.href) continue;
      seen.add(text); out.push(r);
      if(out.length >= maxKeep) break;
    }
  }
  return out;
}

  {key:"days", kind:"radio", title:"第 9 步(选填) · 计划玩几天？", sub:"选填，可跳过", required:false,

  {key:"fitness", kind:"radio", title:"第 11 步(选填) · 你的体力/活动强度如何？", sub:"选填，可跳过", required:false,

/* ================= 攻略生成 ================= */
function badge(text, cls){ return `<span class="badge ${cls||''}">${esc(text)}</span>`; }

function buildGuide(p, rich, discovery, live, weekend){
  live = live || [];
  let labels = profileLabels(p);
  if(weekend && p.city){
    labels = [["出发", p.city + (p.district ? "·" + p.district : "")]].concat(labels);
  }
  const chips = labels.map(([k,v]) => `<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`).join("");
  const cards = rich.map((item, i) => {
    const d = item.dest;
    const pref = new Set(toList(p.preference));
    const tags = [];
    for(const t of d.types) tags.push(badge(t, pref.has(t) ? "hit" : ""));
    if(d.season.includes(p.season)) tags.push(badge(p.season + "季最佳", "hit"));
    if(d.transport.includes(p.transport)) tags.push(badge("适合" + p.transport, "hit"));
    if(d.style.includes(p.style)) tags.push(badge(p.style, "hit"));
    if(d.companion.includes(p.companion)) tags.push(badge("适合" + p.companion, "hit"));
    tags.push(badge(d.budget_cny, "price"));
    const visa = d.visa_note ? ` · 🛂 ${esc(d.visa_note)}` : "";
    const imgs = item.images.length
      ? `<div class="g-imgs">${item.images.map(im => `<img src="${im.value}" alt="${esc(d.name)}" ${im.kind==="url"?'loading="lazy"':""}>`).join("")}</div>` : "";
    const snips = item.snippets.filter(s=>s.body).slice(0,3).map(s =>
      `<p class="snip"><a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.title)||"链接"}</a><span>${esc(s.body)}</span></p>`).join("");
    return `<div class="g-card">
      <div class="g-head-row"><span class="g-rank">#${i+1}</span>
        <div><div class="g-title">${esc(d.name)}</div>
        <div class="g-sub">${esc(d.region)} · 匹配度 ${item.score} 分 · ${esc(d.days)} 天为宜${visa}</div></div></div>
      <div class="g-tags">${tags.join("")}</div>
      ${imgs}
      <div class="g-reason">💡 <b>推荐理由：</b>${esc(d.reason)}</div>
      <div class="g-cols">
        <div class="g-col"><h4>⭐ 必玩亮点</h4><ul>${d.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>
        <div class="g-col"><h4>🍜 特色美食</h4><div class="foods">${d.food.map(f=>`<span class="food">${esc(f)}</span>`).join("")}</div></div>
      </div>
      ${snips ? `<div class="web-tips"><h4>🌐 全网参考</h4>${snips}</div>` : ""}
    </div>`;
  }).join("");
  const disc = discovery.length
    ? `<div class="disc"><h4>🌍 全网热门线索（供你参考）</h4>${discovery.slice(0,6).filter(s=>s.body).map(s =>
        `<p class="snip"><a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.title)||"链接"}</a><span>${esc(s.body)}</span></p>`).join("")}</div>` : "";
  const liveHtml = live.length
    ? `<div class="disc"><h4>${weekend ? `📍 从 ${esc(p.city||"")} 出发 · 周边周末好去处（全网实时发现）` : "🌐 全网实时新发现（知识库之外，同样值得关注）"}</h4>${live.map(x =>
        `<div class="g-card" style="margin:12px 0">
          <div class="g-head-row"><span class="g-rank">✨</span>
            <div><div class="g-title">${esc(x.name)}</div>
            <div class="g-sub">全网实时发现 · <a href="${esc(x.href)}" target="_blank" rel="noopener">查看来源 ↗</a></div></div></div>
          ${x.images && x.images.length ? `<div class="g-imgs">${x.images.map(im => `<img src="${im.value}" alt="${esc(x.name)}" ${im.kind==="url"?'loading="lazy"':""}>`).join("")}</div>` : ""}
          <div class="g-reason">💡 ${esc(x.body)}</div>
        </div>`).join("")}</div>` : "";
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>专属旅行目的地推荐</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif;background:linear-gradient(160deg,#eef6f5,#f5f6f8);color:#1f2937;line-height:1.7}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  header{text-align:center;padding:34px 20px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(15,118,110,.25)}
  header h1{margin:0 0 8px;font-size:30px} header p{margin:0;opacity:.92}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 4px}
  .chip{background:rgba(255,255,255,.16);padding:6px 13px;border-radius:999px;font-size:14px} .chip b{margin-right:4px}
  .card{background:#fff;border-radius:18px;padding:24px;margin:22px 0;box-shadow:0 4px 18px rgba(0,0,0,.06)}
  .card-head{display:flex;gap:14px;align-items:flex-start} .rank{font-size:26px;font-weight:800;color:#f59e0b;line-height:1.1}
  .title h2{margin:0;font-size:22px} .sub{color:#6b7280;font-size:13px;margin-top:3px}
  .tags{margin:14px 0;display:flex;flex-wrap:wrap;gap:7px}
  .badge{font-size:12.5px;padding:4px 11px;border-radius:999px;background:#eef2f7;color:#475569}
  .badge.hit{background:#dcfce7;color:#15803d;font-weight:600} .badge.price{background:#fef3c7;color:#b45309;font-weight:600}
  .imgs{display:flex;gap:12px;margin:14px 0} .imgs img{width:calc(50% - 6px);border-radius:14px;object-fit:cover;aspect-ratio:16/10;box-shadow:0 3px 10px rgba(0,0,0,.12)}
  .reason{background:#f0fdfa;border-left:4px solid #0f766e;padding:12px 15px;border-radius:10px;margin:14px 0}
  .cols{display:flex;gap:20px;flex-wrap:wrap} .col{flex:1 1 260px} .col h4{margin:6px 0 8px;color:#0f766e} .col ul{margin:0;padding-left:20px}
  .foods{display:flex;flex-wrap:wrap;gap:7px} .food{background:#fff7ed;color:#c2410c;padding:4px 11px;border-radius:999px;font-size:13px}
  .web h4{margin:14px 0 6px;color:#0f766e}
  .snip{font-size:13px;color:#4b5563;border-bottom:1px dashed #e5e7eb;padding-bottom:8px;margin:8px 0} .snip a{color:#0f766e;font-weight:600;text-decoration:none} .snip span{display:block;color:#6b7280;margin-top:2px}
  .disc{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:18px 22px;margin:24px 0} .disc h3{margin:0 0 8px;color:#b45309}
  footer{text-align:center;color:#9ca3af;font-size:12.5px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>${weekend ? "🚗 周末就近游推荐" : "🧳 你的专属旅行目的地推荐"}</h1><p>${weekend ? `从 ${esc(p.city||"")} 出发 · 1-2 天可达的好去处 + 知识库匹配` : "根据你的偏好 + 全网搜索，为你精选以下目的地"}</p><div class="chips">${chips}</div></header>
  ${weekend ? liveHtml : ""}
  ${cards}
  ${weekend ? "" : liveHtml}
  ${disc}
  <footer>本攻略由「旅行目的地推荐助手」自动生成 · 生成时间 ${ts} · 网络信息仅供参考，出行前请二次核实</footer>
</div>
</body>
</html>`;
}

function buildSummary(p, rich, discovery, live, weekend){
  live = live || [];
  const lines = ["=== 你的旅行画像 ==="];
  if(weekend && p.city) lines.push(`  出发：${p.city}${p.district ? "·"+p.district : ""}`);
  for(const [k,v] of profileLabels(p)) lines.push(`  ${k}：${v}`);
  if(live.length){
    lines.push("");
    lines.push(weekend ? "=== 周边周末好去处（全网实时发现） ===" : "=== 全网实时新发现（知识库之外） ===");
    for(const x of live) lines.push(`  ✨ ${x.name}：${(x.body||"").slice(0,80)}`);
  }
  lines.push("", "=== 知识库匹配推荐 ===");
  rich.forEach((item, i) => {
    const d = item.dest;
    lines.push(`${i+1}. ${d.name}（${d.region} · 匹配度 ${item.score} 分 · 参考 ${d.budget_cny}${d.visa_note ? " · "+d.visa_note : ""}）`);
    lines.push(`   理由：${d.reason}`);
    lines.push(`   必玩：${d.highlights.slice(0,4).join("、")}`);
    lines.push(`   美食：${d.food.slice(0,4).join("、")}`);
  });
  if(discovery.length){
    lines.push("", "=== 全网热门线索 ===");
    for(const s of discovery.slice(0,6)) if(s.title) lines.push(`  · ${s.title}`);
  }
  return lines.join("\n");
}

/* ================= UI 状态 ================= */
const S = { answers:{}, idx:0, mode:"wizard", err:"", status:"", profile:null, shown:[], batchNo:0, summary:"", guide:"", richCount:0 };

function hdr(){
  const total = curSteps().length;
  const pct = S.mode === "wizard" ? Math.round((S.idx+1)/total*100) : 100;
  const stepTxt = S.mode === "wizard" ? `${S.idx+1} / ${total}` : (S.batchNo ? `第 ${S.batchNo} 批 · 已看 ${S.shown.length} 个` : "");
  return `<header class="app">
    <h1>🧳 旅行目的地推荐助手</h1>
    <div class="sub">${S.mode==="wizard" ? "回答几个小问题，为你全网精选目的地（含周边周末游）" : S.mode==="busy" ? "正在生成，请稍候…" : S.mode==="nomore" ? "换一批到头啦" : "推荐结果"}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="steps">${stepTxt}</div>
  </header>`;
}

function render(){
  const app = document.getElementById("app");
  if(S.mode === "wizard"){ app.innerHTML = hdr() + stepBody() + navBody(); bindStep(); }
  else if(S.mode === "busy"){ app.innerHTML = hdr() + `<div class="card"><div class="status" id="status">⏳ ${esc(S.status)}</div></div>`; }
  else if(S.mode === "nomore"){ app.innerHTML = hdr() + nomoreBody(); bindNomore(); }
  else if(S.mode === "result"){ app.innerHTML = hdr() + resultBody(); bindResult(); }
}

function curSteps(){ return activeSteps(S.answers); }

function stepBody(){
  const steps = curSteps();
  S.idx = Math.min(S.idx, steps.length - 1);
  const st = steps[S.idx];
  const saved = S.answers[st.key];
  const rawTitle = st.title.replace(/^第\s*\d+\s*步(?:\(选填\))?\s*[·.]\s*/, "");
  const optTag = st.required === false ? "（选填）" : "";
  let inner = `<div class="card"><div class="q-title">第 ${S.idx+1} 步${optTag} · ${esc(rawTitle)}</div>`;
  if(st.sub) inner += `<div class="q-sub">${esc(st.sub)}</div>`;
  if(st.kind === "check"){
    for(const o of st.options){
      const sel = Array.isArray(saved) && saved.includes(o);
      inner += `<button class="opt${sel?" sel":""}" data-check="${esc(o)}">${sel?"✓ ":""}${esc(o)}</button>`;
    }
  } else if(st.kind === "radio"){
    for(const o of st.options){
      inner += `<button class="opt${saved===o?" sel":""}" data-radio="${esc(o)}">${saved===o?"✓ ":""}${esc(o)}</button>`;
    }
  } else if(st.kind === "num"){
    inner += `<input class="text" id="txt-num" type="number" inputmode="numeric" min="0" step="50" value="${esc(S.answers.budget||"")}" placeholder="例如 800">`;
    inner += `<div class="note">单位：元/人；留空表示不限预算</div>`;
  } else if(st.kind === "city"){
    inner += `<div class="note" style="margin-top:2px">所在城市（必填）</div>`;
    inner += `<input class="text" id="txt-city" value="${esc(S.answers.city||"")}" placeholder="例如：广州">`;
    inner += `<div class="note" style="margin-top:8px">区 / 县（选填）</div>`;
    inner += `<input class="text" id="txt-district" value="${esc(S.answers.district||"")}" placeholder="例如：天河区">`;
  } else {
    inner += `<input class="text" id="txt" value="${esc(saved||"")}" placeholder="请输入…">`;
    inner += `<div class="note">可直接点"下一步"跳过</div>`;
  }
  if(S.err) inner += `<div class="err">⚠️ ${esc(S.err)}</div>`;
  inner += "</div>";
  return inner;
}

function navBody(){
  const steps = curSteps();
  const first = S.idx === 0, last = S.idx === steps.length - 1;
  return `<div class="nav">
    <button class="btn2" id="back" ${first?"disabled":""}>← 上一步</button>
    <button class="btn1" id="next">${last ? "✓ 生成推荐" : "下一步 →"}</button>
  </div>`;
}

function bindStep(){
  const back = document.getElementById("back"), next = document.getElementById("next");
  if(back) back.onclick = () => { S.idx = Math.max(0, S.idx-1); S.err=""; render(); };
  if(next) next.onclick = onNext;
  const step = curSteps()[S.idx];
  document.querySelectorAll("[data-radio]").forEach(b => b.onclick = () => {
    S.answers[step.key] = b.getAttribute("data-radio");
    S.err = ""; render();
  });
  document.querySelectorAll("[data-check]").forEach(b => b.onclick = () => {
    const key = step.key, v = b.getAttribute("data-check");
    let arr = Array.isArray(S.answers[key]) ? S.answers[key].slice() : [];
    arr = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v);
    S.answers[key] = arr; S.err = ""; render();
  });
  const txt = document.getElementById("txt");
  if(txt) txt.onchange = () => { S.answers[step.key] = txt.value; };
  const tNum = document.getElementById("txt-num");
  if(tNum) tNum.onchange = () => { S.answers.budget = tNum.value; };
  const tCity = document.getElementById("txt-city");
  if(tCity) tCity.onchange = () => { S.answers.city = tCity.value; };
  const tDis = document.getElementById("txt-district");
  if(tDis) tDis.onchange = () => { S.answers.district = tDis.value; };
}

function onNext(){
  const steps = curSteps();
  const st = steps[S.idx];
  if(st.required){
    const v = st.kind === "city" ? (S.answers.city || "").trim() : S.answers[st.key];
    if(!v || (Array.isArray(v) && !v.length)){
      S.err = st.kind === "check" ? "请至少选择一项" : (st.kind === "city" ? "请填写所在城市" : "请选择一项");
      render(); return;
    }
  }
  S.err = "";
  if(S.idx < steps.length - 1){ S.idx++; render(); }
  else { startGenerate(); }
}

function setStatus(t){ S.status = t; const el = document.getElementById("status"); if(el) el.textContent = "⏳ " + t; }

async function startGenerate(){
  S.profile = buildProfile(S.answers);
  S.shown = []; S.batchNo = 1;
  await runGeneration();
}

async function nextBatch(){
  S.batchNo++;
  await runGeneration();
}

async function runGeneration(){
  S.mode = "busy"; S.status = "正在根据你的偏好匹配目的地…"; render();
  const weekend = !!S.profile.city;
  const province = weekend ? provinceOf(S.profile.city) : "";
  const top = recommend(S.profile, 6, new Set(S.shown), weekend, province);
  if(!top.length){
    S.mode = "nomore"; render(); return;
  }
  // 计时提示：让用户看到进度，网络慢时也能知道在跑
  let tick = 0;
  setStatus("正在联网搜索（并行）…");
  const timer = setInterval(() => { tick += 1; setStatus(`正在联网搜索攻略与配图…已用时 ${tick} 秒（网络慢会自动跳过，不影响推荐结果）`); }, 1000);

  const kbNames = new Set(DESTINATIONS.map(d => d.name));
  const excludeSet = new Set([...kbNames, ...S.shown]);

  try{
    // 三个任务完全并行：全网线索 / 6 个目的地（各自内部也并行）/ 实时发现
    const [discovery, rich, live] = await Promise.all([
      withTimeout(discoverySearch(S.profile), 8000, []),
      Promise.all(top.map(async (item) => {
        const d = item.dest;
        const [snippets, imgUrls] = await Promise.all([
          withTimeout(webSearchMulti(`${d.name} 必去景点 亮点 攻略`, 4), 6000, []),
          withTimeout(imageSearch(`${d.name} 风景`, 4), 6000, []),
        ]);
        const images = [];
        const cand = imgUrls.slice(0, 2);
        if(cand.length){
          const loaded = await Promise.all(cand.map(u =>
            withTimeout(imgToDataUrl(u), 6000, null).then(data => data ? {kind:"data", value:data} : {kind:"url", value:u})
          ));
          images.push(...loaded);
        }
        return {score: item.score, dest: d, snippets, images};
      })),
      withTimeout(liveDiscover(S.profile, excludeSet, weekend ? 6 : 4, weekend), 12000, []),
    ]);

    // 实时发现的配图：全部并行，各 1 张
    await Promise.all(live.map(async (item) => {
      item.images = [];
      const urls = await withTimeout(imageSearch(item.name + " 风景", 3), 5000, []);
      if(urls.length){
        const data = await withTimeout(imgToDataUrl(urls[0]), 5000, null);
        item.images.push(data ? {kind:"data", value:data} : {kind:"url", value:urls[0]});
      }
    }));

    await Promise.resolve(); // 占位，保持结构清晰
    S.summary = buildSummary(S.profile, rich, discovery, live, weekend);
    S.guide = buildGuide(S.profile, rich, discovery, live, weekend);
    S.richCount = rich.length;
    S.shown.push(...rich.map(r => r.dest.name), ...live.map(x => x.name));
    S.mode = "result"; render();
  } catch(e){
    S.mode = "result"; S.richCount = 0;
    S.summary = "生成时出错：" + ((e && e.message) || e) + "\n\n请点「重新填写」重试。";
    S.guide = "<!DOCTYPE html><html><head><meta charset='utf-8'></head><body><h2>生成失败</h2><p>" + esc(String((e && e.message) || e)) + "</p></body></html>";
    render();
  } finally {
    clearInterval(timer);
  }
}

function nomoreBody(){
  return `<div class="card" style="text-align:center;padding:28px 18px">
    <div style="font-size:40px">🔍</div>
    <p style="margin:12px 0;font-size:15px;color:#92400e">知识库里暂时没有更多符合条件的目的地了，<br>建议返回调整条件重新填写～</p>
    <div class="nav">
      <button class="btn1" id="restart" style="flex:1">↺ 重新填写问卷</button>
    </div>
  </div>`;
}

function bindNomore(){
  const b = document.getElementById("restart");
  if(b) b.onclick = restart;
}

function resultBody(){
  const labels = profileLabels(S.profile);
  const chips = labels.map(([k,v]) => `<span class="chip"><b>${esc(k)}</b>${esc(v)}</span>`).join("");
  const list = (S.summary || "").split("\n").filter(l => /^\d+\.\s/.test(l)).map(l => {
    const m = l.match(/^(\d+)\.\s(.+?)（(.+?) · 匹配度 ([\d.]+) 分 · 参考 (.+?)(?: · (.+))?）$/);
    if(!m) return `<div class="rank-item">${esc(l)}</div>`;
    return `<div class="rank-item"><b>${m[1]}. ${esc(m[2])}</b>
      <div class="meta">${esc(m[3])} · 匹配度 ${m[4]} 分 · ${esc(m[5])}${m[6]?" · 🛂 "+esc(m[6]):""}</div></div>`;
  }).join("");
  const why = (S.summary || "").split("\n").filter(l => /^\s+理由：/.test(l));
  const fullList = (S.summary || "").split("\n").filter(l => /^\d+\.\s/.test(l)).map((l,i) =>
    `<div class="rank-item"><b>${esc(l)}</b>
     ${why[i] ? `<div class="why"><b>💡</b> ${esc(why[i].replace(/^\s+理由：/,""))}</div>` : ""}</div>`).join("");
  return `<div class="card">
    <div class="q-title">✅ 推荐已生成（第 ${S.batchNo} 批 · ${S.richCount} 个目的地）</div>
    <div class="chips">${chips}</div>
    ${fullList}
    <div class="nav">
      <button class="btn3" id="swap" style="flex:1.2">🔄 换一批</button>
      <button class="btn2" id="restart">重新填写</button>
      <button class="btn1" id="download">⬇️ 下载攻略</button>
    </div>
    <div class="note">攻略已按你的画像生成（含配图与全网参考），可直接转发给同行伙伴。</div>
  </div>
  <div class="guide">
    <div class="g-head"><h2>🧳 你的专属旅行目的地推荐</h2></div>
    ${renderGuideBody()}
    <footer class="g-foot">图片来自维基共享/Bing 搜索，版权归原作者所有 · 信息仅供参考</footer>
  </div>`;
}

function renderGuideBody(){
  const doc = new DOMParser().parseFromString(S.guide, "text/html");
  return doc.body.innerHTML.replace(/<header>[\s\S]*?<\/header>/g, "").replace(/<footer>[\s\S]*?<\/footer>/g, "");
}

function bindResult(){
  const swap = document.getElementById("swap");
  const restartBtn = document.getElementById("restart");
  const dl = document.getElementById("download");
  if(swap) swap.onclick = nextBatch;
  if(restartBtn) restartBtn.onclick = restart;
  if(dl) dl.onclick = () => downloadGuide();
}

function downloadGuide(){
  const blob = new Blob([S.guide], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,10).replace(/-/g,"");
  a.href = URL.createObjectURL(blob);
  a.download = `旅行攻略_${ts}.html`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

function restart(){
  S.answers = {}; S.idx = 0; S.mode = "wizard"; S.err = ""; S.profile = null; S.shown = []; S.batchNo = 0;
  render();
}

/* ================= 自检（#selftest 或无浏览器环境） ================= */
function runSelfTest(){
  const p = {preference:["自然景观","美食体验"],budget_tier:"中",budget_label:"6000-10000元",companion:"情侣",season:"秋",months:"10月",transport:"自驾",scope:"国内",style:"享受型",days:"4-6",activities:["摄影","美食探店"],climate:"温和"};
  const top = recommend(p, 6);
  const b2 = recommend(p, 6, new Set(top.map(x => x.dest.name)));
  const b3 = recommend(p, 6, new Set(top.concat(b2).map(x => x.dest.name)));
  const lines = ["SELFTEST DESTINATIONS=" + DESTINATIONS.length];
  top.forEach((x,i) => lines.push(`B1#${i+1} ${x.dest.name} score=${x.score}`));
  b2.forEach((x,i) => lines.push(`B2#${i+1} ${x.dest.name} score=${x.score}`));
  b3.forEach((x,i) => lines.push(`B3#${i+1} ${x.dest.name} score=${x.score}`));
  const all = new Set(top.concat(b2).concat(b3).map(x => x.dest.name));
  lines.push("BATCH_OVERLAP=" + (18 - all.size));
  const VOCAB = {types:["自然景观","人文景观","娱乐游玩","美食体验"],season:["春","夏","秋","冬"],budget:["低","中低","中","中高","高"],transport:["公共交通","自驾","包车"],style:["特种兵","享受型","家庭轻松型","酒店躺平"],companion:["单人","情侣","朋友","家庭(带小孩)","家庭(带老人)","团队"],activities:["徒步登山","海滨沙滩","滑雪","温泉","博物馆历史","主题乐园","购物","摄影","潜水/水上运动","美食探店"],climate:["温暖","凉爽","雪","温和"]};
  let bad = 0;
  for(const d of DESTINATIONS){
    for(const k in VOCAB){
      if(d[k] === undefined){ bad++; continue; }
      for(const x of (Array.isArray(d[k]) ? d[k] : [d[k]])){ if(!VOCAB[k].includes(x)) bad++; }
    }
    for(const k of ["name","country","region","budget_cny","keywords","reason"]){ if(!d[k]) bad++; }
    if(!Array.isArray(d.highlights) || !d.highlights.length) bad++;
    if(!Array.isArray(d.food) || !d.food.length) bad++;
  }
  lines.push("VOCAB_BAD=" + bad);
  // 新功能自检：城市映射 / 周末过滤 / 名字提取 / 场景画像
  lines.push("CITY_MAP_SIZE=" + Object.keys(CITY_PROVINCE).length);
  const pw = {preference:["自然景观"],budget_tier:"低",companion:"朋友",season:"秋",transport:"自驾",scope:"国内",style:"享受型",days:"1-3"};
  const wrec = recommend(pw, 8, new Set(), true, "广东");
  lines.push("WEEKEND_DAYS_OK=" + wrec.every(x => daysRange(x.dest.days)[0] <= 2));
  lines.push("WEEKEND_TOP=" + wrec.slice(0,3).map(x => x.dest.name).join("|"));
  const prof = buildProfile({scene:"🚗 周末就近游(1-2天,从所在城市出发)", city:"广州", district:"天河区", preference:["美食体验"], budget:"3000-6000元", companion:"朋友", season:"秋季(9-11月)", transport:"公共交通", style:"特种兵(早出晚归)"});
  lines.push("WEEKEND_PROFILE_OK=" + (prof.scope === "国内" && prof.days === "1-3" && prof.city === "广州" && prof.style === "特种兵"));
  lines.push("EXTRACT_SAMPLE=" + extractNames("广州周边一日游推荐:沙湾古镇、从化流溪河、增城白水寨、南沙湿地、白云山 都是好去处").join("|"));
  lines.push("ACTIVE_STEPS_FAR=" + activeSteps({scene:"🛫 远途旅行(几天以上)"}).length);
  lines.push("ACTIVE_STEPS_WEEKEND=" + activeSteps({scene:"🚗 周末就近游(1-2天,从所在城市出发)"}).length);
  const pw2 = buildProfile({scene:"🚗 周末就近游(1-2天,从所在城市出发)", city:"吉林", preference:["自然景观"], season:"秋季(9-11月)", transport:"自驾", style:"享受型", budget:"500"});
  lines.push("BUDGET_PARSE=" + (pw2.budget_tier === "低" && pw2.budget_label === "500元/人"));
  const jl = recommend({preference:["自然景观"],scope:"国内",days:"1-3",budget_tier:"低",season:"秋",style:"享受型",transport:"自驾",city:"吉林"}, 8, new Set(), true, "吉林");
  lines.push("WEEKEND_PROVINCE_OK=" + jl.every(x => ["吉林","辽宁","黑龙江","内蒙古"].includes(x.dest.region)));
  lines.push("WEEKEND_JL_TOP=" + jl.slice(0,3).map(x=>x.dest.name).join("|"));
  return lines.join("\n");
}

(function boot(){
  if(typeof location !== "undefined" && location.hash === "#selftest"){
    const pre = document.createElement("pre");
    pre.id = "selftest";
    pre.textContent = runSelfTest();
    document.title = "SELFTEST-DONE";
    document.body.appendChild(pre);
    return;
  }
  if(typeof document !== "undefined"){
    document.getElementById("app");
    render();
  }
})();
</script>
